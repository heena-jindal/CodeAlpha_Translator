<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Translation Tool</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --text:#1a1c23; --muted:#6b7280;
    --border:#e3e5ea; --accent:#4f46e5; --accent-hover:#4338ca;
    --accent-text:#ffffff; --danger:#dc2626; --success:#16a34a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1117; --card:#181b24; --text:#eef0f5; --muted:#9aa0ac;
      --border:#2a2e3a; --accent:#818cf8; --accent-hover:#6366f1; --accent-text:#0f1117;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; justify-content:center; min-height:100vh;
  }
  .wrap{width:100%; max-width:720px; padding:28px 20px 40px;}
  h1{font-size:1.4rem; margin:0 0 4px;}
  p.sub{color:var(--muted); margin:0 0 22px; font-size:.92rem;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px;}
  .lang-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  select{flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.95rem;}
  .swap-btn{background:transparent; border:1px solid var(--border); color:var(--text); width:38px; height:38px; border-radius:10px; cursor:pointer; font-size:1rem;}
  .swap-btn:hover{background:var(--border);}
  textarea{width:100%; min-height:120px; resize:vertical; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:1rem; font-family:inherit;}
  .row{display:flex; justify-content:space-between; margin-top:6px;}
  .count{color:var(--muted); font-size:.8rem;}
  .actions{display:flex; gap:10px; margin:16px 0;}
  button.primary{flex:1; background:var(--accent); color:var(--accent-text); border:none; padding:12px 16px; border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer;}
  button.primary:hover{background:var(--accent-hover);}
  button.primary:disabled{opacity:.6; cursor:not-allowed;}
  .output-wrap{background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px; min-height:100px; white-space:pre-wrap; font-size:1rem; line-height:1.45;}
  .placeholder{color:var(--muted);}
  .icon-btns{display:flex; gap:8px; margin-top:10px;}
  .icon-btn{background:transparent; border:1px solid var(--border); color:var(--text); padding:7px 12px; border-radius:9px; cursor:pointer; font-size:.85rem;}
  .icon-btn:hover{background:var(--border);}
  .status{font-size:.85rem; color:var(--muted); min-height:18px; margin-top:8px;}
  .status.error{color:var(--danger);}
  .status.ok{color:var(--success);}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌐 Language Translator</h1>
  <p class="sub">Type text, pick your languages, and translate (powered by the free MyMemory Translation API).</p>

  <div class="card">
    <div class="lang-row">
      <select id="sourceLang"></select>
      <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>
      <select id="targetLang"></select>
    </div>

    <textarea id="inputText" placeholder="Enter text to translate..." maxlength="500"></textarea>
    <div class="row"><span class="count"><span id="charCount">0</span>/500</span></div>

    <div class="actions">
      <button class="primary" id="translateBtn">Translate</button>
    </div>

    <div class="output-wrap" id="output"><span class="placeholder">Translation will appear here...</span></div>
    <div class="icon-btns">
      <button class="icon-btn" id="copyBtn">📋 Copy</button>
      <button class="icon-btn" id="speakBtn">🔊 Listen</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
